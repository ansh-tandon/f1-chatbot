<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none">
  <defs>
    <linearGradient id="trackGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e10600" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ff8000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e10600" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Monaco Circuit Layout - Stylized -->
  <!-- Main track outline -->
  <path
    d="M 220 180
       C 220 140, 280 110, 340 110
       L 560 110
       C 600 110, 640 100, 680 120
       Q 720 140, 740 180
       L 780 280
       Q 800 320, 840 340
       L 920 380
       Q 960 395, 980 430
       L 1000 500
       Q 1010 540, 980 570
       L 920 620
       Q 880 650, 840 660
       L 700 680
       Q 660 685, 640 710
       Q 620 740, 580 750
       L 440 770
       Q 400 775, 370 760
       Q 320 730, 300 680
       L 280 580
       Q 270 540, 240 520
       Q 200 490, 180 440
       L 170 360
       Q 160 310, 180 270
       L 210 210
       Q 215 190, 220 180 Z"
    stroke="url(#trackGlow)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#blur)"
    opacity="0.7"
  />

  <!-- Thinner inner detail line for depth -->
  <path
    d="M 220 180
       C 220 140, 280 110, 340 110
       L 560 110
       C 600 110, 640 100, 680 120
       Q 720 140, 740 180
       L 780 280
       Q 800 320, 840 340
       L 920 380
       Q 960 395, 980 430
       L 1000 500
       Q 1010 540, 980 570
       L 920 620
       Q 880 650, 840 660
       L 700 680
       Q 660 685, 640 710
       Q 620 740, 580 750
       L 440 770
       Q 400 775, 370 760
       Q 320 730, 300 680
       L 280 580
       Q 270 540, 240 520
       Q 200 490, 180 440
       L 170 360
       Q 160 310, 180 270
       L 210 210
       Q 215 190, 220 180 Z"
    stroke="rgba(255,255,255,0.04)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Corner markers as small dots -->
  <!-- Sainte Dévote -->
  <circle cx="340" cy="110" r="4" fill="#e10600" opacity="0.15"/>
  <!-- Massenet -->
  <circle cx="680" cy="120" r="4" fill="#e10600" opacity="0.15"/>
  <!-- Casino -->
  <circle cx="740" cy="180" r="4" fill="#ff8000" opacity="0.12"/>
  <!-- Mirabeau -->
  <circle cx="780" cy="280" r="4" fill="#e10600" opacity="0.15"/>
  <!-- Portier -->
  <circle cx="840" cy="340" r="4" fill="#ff8000" opacity="0.12"/>
  <!-- Tunnel Exit -->
  <circle cx="980" cy="430" r="4" fill="#e10600" opacity="0.15"/>
  <!-- Nouvelle Chicane -->
  <circle cx="980" cy="570" r="4" fill="#ff8000" opacity="0.12"/>
  <!-- Tabac -->
  <circle cx="840" cy="660" r="4" fill="#e10600" opacity="0.15"/>
  <!-- Swimming Pool -->
  <circle cx="640" cy="710" r="4" fill="#ff8000" opacity="0.12"/>
  <!-- Rascasse -->
  <circle cx="370" cy="760" r="4" fill="#e10600" opacity="0.15"/>
  <!-- Anthony Noghes -->
  <circle cx="240" cy="520" r="4" fill="#ff8000" opacity="0.12"/>

  <!-- Start/Finish line marker -->
  <line x1="215" y1="170" x2="225" y2="190" stroke="#e10600" stroke-width="2" opacity="0.25"/>

  <!-- Very faint corner labels -->
  <text x="340" y="95" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.06)" text-anchor="middle">STE DÉVOTE</text>
  <text x="750" y="170" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.06)" text-anchor="middle">CASINO</text>
  <text x="1010" cy="430" y="425" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.06)" text-anchor="start">TUNNEL</text>
  <text x="640" y="700" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.06)" text-anchor="middle">PISCINE</text>
  <text x="370" y="785" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.06)" text-anchor="middle">RASCASSE</text>
</svg>
